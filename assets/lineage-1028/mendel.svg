" font-family="Georgia,serif" >of the cross.</text><g stroke-linecap="round" stroke-linejoin="round"><circle cx="330" cy="485" r="43" stroke="#c3a944" fill="#c3a944" stroke-width="2"/><circle cx="470" cy="485" r="43" stroke="#c3a944" fill="#c3a944" stroke-width="2"/><circle cx="330" cy="630" r="43" stroke="#c3a944" fill="#c3a944" stroke-width="2"/><circle cx="470" cy="630" r="43" stroke="#719483" fill="#719483" stroke-width="2"/><text x="400" y="715" fill="#243d40" font-size="18" text-anchor="middle" font-family="Georgia,serif">four equally weighted outcomes</text></g><g transform="translate(95.000 774.544) scale(1.71502)">
 
