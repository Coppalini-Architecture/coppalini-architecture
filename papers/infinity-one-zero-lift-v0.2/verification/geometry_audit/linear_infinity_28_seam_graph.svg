<text x="520" y="48" font-family="DejaVu Serif, serif" font-size="28" fill="#262522" text-anchor="middle" >Linear Infinity → eight occurrences → 28 seams</text>
<text x="225" y="89" font-family="DejaVu Serif, serif" font-size="18" fill="#4d4940" text-anchor="middle" >F⁴(p, z) = (p, Lₐₓz)</text>
<text x="545" y="89" font-family="DejaVu Serif, serif" font-size="18" fill="#4d4940" text-anchor="middle" >Λ(Lₐₓz) = Λ(z) + T</text>
<text x="860" y="89" font-family="DejaVu Serif, serif" font-size="18" fill="#4d4940" text-anchor="middle" >n = 4c + p</text>
<text x="520" y="121" font-family="DejaVu Serif, serif" font-size="14" fill="#777065" text-anchor="middle" >Technical incidence drawing · all 28 pairs · source color assignment preserved</text>
