<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d">
<title id="t">Readable Reality closure: return with retained lift</title>
<desc id="d">A phase circle projects a lifted helical return. The visible phase returns to the reference while the vertical memory coordinate advances.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#171717}
  .muted{fill:#666}.line{fill:none;stroke:#171717;stroke-width:3}.thin{fill:none;stroke:#777;stroke-width:1.5}
  .dash{stroke-dasharray:9 9}.moon{fill:#f4e3a4;stroke:#171717;stroke-width:2}.open{fill:#fff;stroke:#171717;stroke-width:2}
</style>
<rect width="960" height="620" fill="#fff"/>
<g transform="translate(0,20)">
  <ellipse cx="470" cy="430" rx="270" ry="92" class="thin"/>
  <line x1="470" y1="115" x2="470" y2="500" class="thin dash"/>
  <text x="492" y="132" font-size="20">Memory lift</text>
  <text x="470" y="555" text-anchor="middle" font-size="20">visible phase / return</text>

  <path d="M470 430
           C650 430 720 360 650 310
           C560 245 360 270 300 215
           C240 160 335 120 470 115" class="line"/>
  <path d="M470 430 C650 430 720 360 650 310" class="thin dash"/>
  <circle cx="470" cy="430" r="12" class="moon"/>
  <circle cx="470" cy="115" r="12" class="open"/>

  <line x1="470" y1="115" x2="470" y2="430" class="thin dash"/>
  <text x="495" y="420" font-size="20">Reference</text>
  <text x="495" y="108" font-size="20">Return</text>
  <text x="610" y="270" font-size="20">Transport</text>
  <text x="328" y="190" font-size="20">Difference retained</text>

  <text x="470" y="585" text-anchor="middle" font-size="18" class="muted">
    same visible read · different occurrence address
  </text>
</g>
</svg>