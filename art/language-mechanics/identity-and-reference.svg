<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="1050" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc"><title id="title">Identity &amp; Reference</title><desc id="desc">The square is a commuting quotient diagram: carrier transport above, induced quotient transport below, and reader classes on the vertical sides. The chosen reference r is fixed below. Finite witness: Σ={x₀,x₁,z₀}, ρ(x₀)=ρ(x₁)=a, ρ(z₀)=b; T swaps x₀,x₁ and fixes z₀. T respects the reader relation, and r=[x₀]ρ is a quotient fixed point despite changed carrier state.</desc><defs><marker id="flow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b38d4e" stroke-width="1"/></marker></defs><rect width="800" height="1050" fill="#faf8f3"/><text x="400" y="74" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#777065" stroke="none" text-anchor="middle" letter-spacing="2">LANGUAGE MECHANICS / 004</text><text x="400" y="149" font-family="Georgia, Times New Roman, serif" font-size="42" fill="#262522" stroke="none" text-anchor="middle" >Identity &amp; Reference</text><g fill="none" stroke="#b38d4e" stroke-width="1" stroke-linejoin="miter"><path d="M280,433 L520,433" marker-end="url(#flow)" stroke="#a2b4cd" stroke-width="2"/><path d="M280,433 L280,673" marker-end="url(#flow)" /><path d="M520,433 L520,673" marker-end="url(#flow)" /><path d="M280,673 L520,673" marker-end="url(#flow)" /><circle cx="280" cy="433" r="5" fill="#a2b4cd" /><circle cx="520" cy="433" r="5" fill="#d8a6a3" /><circle cx="280" cy="673" r="5" fill="#faf8f3" /><circle cx="520" cy="673" r="5" fill="#faf8f3" /><text x="280" y="414" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#262522" stroke="none" text-anchor="middle" >x₀</text><text x="520" y="414" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#262522" stroke="none" text-anchor="middle" >x₁</text><text x="280" y="706" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#262522" stroke="none" text-anchor="middle">[x₀]<tspan baseline-shift="sub" font-size="12.6">ρ</tspan></text><text x="520" y="706" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#262522" stroke="none" text-anchor="middle">[x₁]<tspan baseline-shift="sub" font-size="12.6">ρ</tspan></text><text x="400" y="415" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#262522" stroke="none" text-anchor="middle" >T</text><text x="258" y="559" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#262522" stroke="none" text-anchor="middle" >ρ</text><text x="542" y="559" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#262522" stroke="none" text-anchor="middle" >ρ</text><text x="400" y="699" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#262522" stroke="none" text-anchor="middle" >T̄</text><text x="400" y="542" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#777065" stroke="none" text-anchor="middle" letter-spacing="2">REFERENCE r</text><text x="353" y="581" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#262522" stroke="none" text-anchor="middle">[x₀]<tspan baseline-shift="sub" font-size="14.7">ρ</tspan></text><text x="400" y="581" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#262522" stroke="none" text-anchor="middle" >=</text><text x="447" y="581" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#262522" stroke="none" text-anchor="middle">[x₁]<tspan baseline-shift="sub" font-size="14.7">ρ</tspan></text></g><svg x="329.8018" y="818.477" width="140.3964" height="35.046" viewBox="0 0 118.98 29.7">
