<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="1050" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc"><title id="title">Memory Return</title><desc id="desc">The heptagonal base loop closes at one marked vertex. A separate lifted interval has two distinct endpoints projecting to that vertex. Declared illustrative regular cover p:ℝ→∂P₇, p(t)=the constant-speed polygonal boundary point at t mod 1. The chosen lift t↦t runs from 0 to 1, so the deck defect is translation +1. Base closure does not identify lifted endpoints. This is a cover-space witness, not a general definition of memory.</desc><defs><marker id="flow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b38d4e" stroke-width="1"/></marker></defs><rect width="800" height="1050" fill="#faf8f3"/><text x="400" y="74" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#777065" stroke="none" text-anchor="middle" letter-spacing="2">LANGUAGE MECHANICS / 007</text><text x="400" y="149" font-family="Georgia, Times New Roman, serif" font-size="42" fill="#262522" stroke="none" text-anchor="middle" >Memory Return</text><g fill="none" stroke="#b38d4e" stroke-width="1" stroke-linejoin="miter"><path d="M400,630 L306.18022,584.81878 L283.00865,483.29749 L347.93395,401.88374 L452.06605,401.88374 L516.99135,483.29749 L493.81978,584.81878 Z" opacity=".8"/><path d="M516.99135,483.29749 L493.81978,584.81878 L400,630" stroke="#a2b4cd" stroke-width="2"/><circle cx="400" cy="630" r="5" fill="#faf8f3" /><text x="548" y="638" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#262522" stroke="none" text-anchor="middle" >γ(0) = γ(1)</text><path d="M285,710 L400,630" stroke-dasharray="3 6" opacity=".5"/><path d="M515,710 L400,630" stroke-dasharray="3 6" opacity=".5"/><path d="M285,710 L515,710" marker-end="url(#flow)" stroke="#a6a4c5" stroke-width="1.7"/><circle cx="285" cy="710" r="5" fill="#a2b4cd" /><circle cx="515" cy="710" r="5" fill="#d8a6a3" /><text x="285" y="744" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#262522" stroke="none" text-anchor="middle" >γ̃(0)</text><text x="515" y="744" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#262522" stroke="none" text-anchor="middle" >γ̃(1)</text><text x="400" y="699" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#262522" stroke="none" text-anchor="middle" >ε</text><text x="400" y="366" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#777065" stroke="none" text-anchor="middle" letter-spacing="2">BASE LOOP</text></g><svg x="327.0406" y="821.7692" width="145.9188" height="28.4616" viewBox="0 0 123.66 24.12">
