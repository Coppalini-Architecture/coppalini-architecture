<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc">
  <title id="title">One Carrier, Three Geometries cover</title>
  <desc id="desc">A single circular three-sector carrier diagram, representing alternating orientation, Lorentzian structure, and positive phase.</desc>
