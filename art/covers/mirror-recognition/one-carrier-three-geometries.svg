  <text x="400" y="928" text-anchor="middle" fill="#676662" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.2">ANTHONY VITO COPPA</text>
  <text x="400" y="954" text-anchor="middle" fill="#676662" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.5">COPPALINI ARCHITECTURE</text>
