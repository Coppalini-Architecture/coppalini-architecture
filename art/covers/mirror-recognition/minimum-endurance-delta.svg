<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Minimum Endurance Delta cover</title>
  <desc id="desc">A quiet sevenfold circular diagram: a heptagon carries the matching partition around a central delta.</desc>
