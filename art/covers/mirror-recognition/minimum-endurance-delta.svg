    <circle cx="400" cy="555" r="187" fill="none" stroke="#d6b07a" stroke-width="1.2"/>
    <circle cx="400" cy="555" r="156" fill="#faf8f3" stroke="#ebe4d7" stroke-width="1.2"/>
    <polygon points="400,405 517.3,461.5 546.2,588.4 465.1,690.2 334.9,690.2 253.8,588.4 282.7,461.5" fill="#d6a9a6" opacity=".53" stroke="#a5adc8" stroke-width="2"/>
    <path d="M400 555L400 405M400 555L517.3 461.5M400 555L546.2 588.4M400 555L465.1 690.2M400 555L334.9 690.2M400 555L253.8 588.4M400 555L282.7 461.5" fill="none" stroke="#b8c3ba" stroke-width="1.3"/>
    <path d="M400 479L464 591H336Z" fill="#faf8f3" stroke="#d6b07a" stroke-width="2.2"/>
    <text x="400" y="567" text-anchor="middle" fill="#4a4741" font-family="Georgia, 'Times New Roman', serif" font-size="42">Δ</text>
    <g fill="#faf8f3" stroke="#d6b07a" stroke-width="1.6">
      <circle cx="400" cy="405" r="4.5"/><circle cx="517.3" cy="461.5" r="4.5"/><circle cx="546.2" cy="588.4" r="4.5"/>
      <circle cx="465.1" cy="690.2" r="4.5"/><circle cx="334.9" cy="690.2" r="4.5"/><circle cx="253.8" cy="588.4" r="4.5"/><circle cx="282.7" cy="461.5" r="4.5"/>
