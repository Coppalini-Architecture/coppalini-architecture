<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="title description">
  <title id="title">Color Meaning Memory Motion</title>
  <desc id="description">A quiet four-sector reader turns color, meaning, memory, and motion around a central point.</desc>
  <rect width="800" height="1050" fill="#faf8f3"/>
  <rect x="30" y="28" width="740" height="994" fill="none" stroke="#b38d4e" stroke-width="1" opacity=".72"/>
  <text x="400" y="128" text-anchor="middle" fill="#262522" font-family="Georgia, Times New Roman, serif" font-size="38"><tspan x="400">Color Meaning</tspan><tspan x="400" dy="45">Memory Motion</tspan></text>
  <text x="400" y="212" text-anchor="middle" fill="#777065" font-family="Georgia, Times New Roman, serif" font-size="12" letter-spacing=".35">A four-field reader for relation, address, and return</text>
  <line x1="214" y1="234" x2="586" y2="234" stroke="#b38d4e" stroke-width="1"/>
  <g transform="translate(400 535)">
    <circle r="174" fill="none" stroke="#b38d4e" stroke-width="1.2"/>
    <circle r="142" fill="none" stroke="#d8d0c2" stroke-width="1"/>
    <path d="M0 0 L0 -142 A142 142 0 0 1 142 0 Z" fill="#a2b4cd" opacity=".78"/>
    <path d="M0 0 L142 0 A142 142 0 0 1 0 142 Z" fill="#b9a8bf" opacity=".78"/>
    <path d="M0 0 L0 142 A142 142 0 0 1 -142 0 Z" fill="#d8a6a3" opacity=".78"/>
    <path d="M0 0 L-142 0 A142 142 0 0 1 0 -142 Z" fill="#d9d09e" opacity=".78"/>
    <path d="M-105 -84 C-35 -128 42 -123 112 -61" fill="none" stroke="#526f7b" stroke-width="2"/>
    <path d="M95 -94 C132 -24 124 45 69 111" fill="none" stroke="#9a8771" stroke-width="2"/>
    <path d="M105 85 C31 125 -47 121 -111 62" fill="none" stroke="#614785" stroke-width="2"/>
    <path d="M-91 96 C-131 27 -121 -49 -64 -111" fill="none" stroke="#3f7569" stroke-width="2"/>
    <circle r="28" fill="#faf8f3" stroke="#262522" stroke-width="1.2"/>
    <circle r="5" fill="#262522"/>
    <text x="0" y="-101" text-anchor="middle" fill="#262522" font-family="Georgia,serif" font-size="14">Color</text>
    <text x="101" y="5" text-anchor="middle" fill="#262522" font-family="Georgia,serif" font-size="14">Meaning</text>
    <text x="0" y="110" text-anchor="middle" fill="#262522" font-family="Georgia,serif" font-size="14">Memory</text>
    <text x="-101" y="5" text-anchor="middle" fill="#262522" font-family="Georgia,serif" font-size="14">Motion</text>
  </g>
  <line x1="154" y1="835" x2="646" y2="835" stroke="#b38d4e" stroke-width="1"/>
  <text x="400" y="872" text-anchor="middle" fill="#262522" font-family="Georgia, Times New Roman, serif" font-size="19">color → meaning → memory → motion</text>
  <text x="400" y="934" text-anchor="middle" fill="#777065" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.2">ANTHONY VITO COPPA</text>
  <text x="400" y="956" text-anchor="middle" fill="#777065" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.7">COPPALINI ARCHITECTURE</text>
</svg>
