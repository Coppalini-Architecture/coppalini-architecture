<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Time Scope — cover</title>
  <desc id="desc">A projective phase circle with a half-turn and double-angle scope direction.</desc>
  <rect width="1200" height="1800" fill="#fbf8f1"/>
  <g fill="#1d2633" text-anchor="middle">
    <text x="600" y="170" font-family="Georgia, serif" font-size="57">Time Scope</text>
    <text x="600" y="220" font-family="Georgia, serif" font-size="23" fill="#746e64">Local phase and projective return</text>
  </g>
  <g transform="translate(600 850)" fill="none" stroke-linecap="round">
    <circle r="356" stroke="#d1ad78" stroke-width="2"/>
    <circle r="332" stroke="#eadcc5" stroke-width="2"/>
    <circle r="296" stroke="#e8dfcd" stroke-width="1.5" stroke-dasharray="2 15"/>
    <path d="M-290 0H290 M0-290V290" stroke="#e0c090" stroke-width="2"/>
    <path d="M0 0L235 -128" stroke="#607f9b" stroke-width="8"/>
    <path d="M0 0L-235 128" stroke="#607f9b" stroke-width="8" opacity=".55"/>
    <path d="M-201-208A290 290 0 0 1 201-208" stroke="#9abda9" stroke-width="17" opacity=".75"/>
    <path d="M201 208A290 290 0 0 1 -201 208" stroke="#c9b4d1" stroke-width="17" opacity=".75"/>
    <path d="M-290 0A290 290 0 0 1 0-290" stroke="#e9df9d" stroke-width="15" opacity=".75"/>
    <path d="M290 0A290 290 0 0 1 0 290" stroke="#ddb0ae" stroke-width="15" opacity=".75"/>
    <path d="M-235 -128A270 270 0 0 1 235 128" stroke="#b5c5d8" stroke-width="3" stroke-dasharray="7 11"/>
    <circle r="13" fill="#1d2633"/>
    <circle cx="235" cy="-128" r="9" fill="#fbf8f1" stroke="#607f9b" stroke-width="3"/>
    <circle cx="-235" cy="128" r="9" fill="#fbf8f1" stroke="#607f9b" stroke-width="3"/>
  </g>
  <g font-family="Georgia, serif" font-size="24" fill="#5f5b55" text-anchor="middle">
    <text x="600" y="1260">sc(Uπz) = sc(z)</text>
    <text x="600" y="1310">⟨σₓ⟩, ⟨σᵧ⟩ = (cos 2α, sin 2α)</text>
  </g>
  <line x1="280" x2="920" y1="1440" y2="1440" stroke="#d9c29b" stroke-width="2"/>
  <g fill="#756f66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">
    <text x="600" y="1512">ANTHONY VITO COPPA</text>
    <text x="600" y="1544">COPPALINI ARCHITECTURE</text>
  </g>
</svg>
