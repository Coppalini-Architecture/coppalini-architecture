<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Gravity Light — cover</title>
  <desc id="desc">A single metric circle with two null directions crossing at its center.</desc>
  <rect width="1200" height="1800" fill="#fbf8f1"/>
  <g fill="#1d2633" text-anchor="middle">
    <text x="600" y="170" font-family="Georgia, serif" font-size="57">Gravity Light</text>
    <text x="600" y="220" font-family="Georgia, serif" font-size="23" fill="#746e64">Metric invariance and fixed null directions</text>
  </g>
  <g transform="translate(600 850)" fill="none" stroke-linecap="round">
    <circle r="356" stroke="#d1ad78" stroke-width="2"/>
    <circle r="332" stroke="#eadcc5" stroke-width="2"/>
    <circle r="296" stroke="#e8dfcd" stroke-width="1.5" stroke-dasharray="2 15"/>
    <path d="M-286 0H286 M0-286V286" stroke="#e0c090" stroke-width="2"/>
    <path d="M-248 175L248-175" stroke="#9bb4cf" stroke-width="6" opacity=".88"/>
    <path d="M-248-175L248 175" stroke="#a5c6b7" stroke-width="6" opacity=".88"/>
    <path d="M-290 0A290 290 0 0 1 -70-281" stroke="#e9df9d" stroke-width="15" opacity=".7"/>
    <path d="M70 281A290 290 0 0 1 290 0" stroke="#c6b4d1" stroke-width="15" opacity=".72"/>
    <path d="M-290 0A290 290 0 0 0 -70 281" stroke="#ddb0ae" stroke-width="15" opacity=".75"/>
    <path d="M70-281A290 290 0 0 0 290 0" stroke="#acc0d3" stroke-width="15" opacity=".72"/>
    <circle r="26" fill="#fbf8f1" stroke="#1d2633" stroke-width="2"/>
    <circle r="7" fill="#1d2633"/>
    <circle cx="-248" cy="175" r="8" fill="#fbf8f1" stroke="#5c738c" stroke-width="2"/>
    <circle cx="248" cy="-175" r="8" fill="#fbf8f1" stroke="#5c738c" stroke-width="2"/>
    <circle cx="-248" cy="-175" r="8" fill="#fbf8f1" stroke="#638878" stroke-width="2"/>
    <circle cx="248" cy="175" r="8" fill="#fbf8f1" stroke="#638878" stroke-width="2"/>
  </g>
  <g font-family="Georgia, serif" font-size="24" fill="#5f5b55" text-anchor="middle">
    <text x="600" y="1260">g(ℓ, ℓ) = 0</text>
