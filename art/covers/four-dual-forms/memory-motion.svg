<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Memory Motion — cover</title>
  <desc id="desc">A circular return reader with two mirrored lift paths and an advancing axial coordinate.</desc>
  <rect width="1200" height="1800" fill="#fbf8f1"/>
  <g fill="#1d2633" text-anchor="middle">
    <text x="600" y="170" font-family="Georgia, serif" font-size="57">Memory Motion</text>
    <text x="600" y="220" font-family="Georgia, serif" font-size="23" fill="#746e64">Return, mirror transfer, and relative phase</text>
  </g>
  <g transform="translate(600 850)" fill="none" stroke-linecap="round">
    <circle r="356" stroke="#d1ad78" stroke-width="2"/>
    <circle r="332" stroke="#eadcc5" stroke-width="2"/>
    <circle r="296" stroke="#e8dfcd" stroke-width="1.5" stroke-dasharray="2 15"/>
    <path d="M-290 0H290 M0-290V290" stroke="#e0c090" stroke-width="2"/>
    <path d="M-231 169C-115 75-126-75-16-170S172-185 245-257" stroke="#98b8a4" stroke-width="7"/>
    <path d="M231 169C115 75 126-75 16-170S-172-185-245-257" stroke="#9bb4cf" stroke-width="7"/>
    <path d="M-263 123A290 290 0 0 1 -86-277" stroke="#e9df9d" stroke-width="15" opacity=".73"/>
    <path d="M86 277A290 290 0 0 1 263 123" stroke="#c6b4d1" stroke-width="15" opacity=".73"/>
    <path d="M-263 123A290 290 0 0 0 -86 277" stroke="#ddb0ae" stroke-width="15" opacity=".73"/>
    <path d="M86-277A290 290 0 0 0 263-123" stroke="#acc0d3" stroke-width="15" opacity=".73"/>
    <path d="M-155 0H155" stroke="#bba57c" stroke-width="2" stroke-dasharray="5 9"/>
    <circle r="8" fill="#1d2633"/>
    <circle cx="-231" cy="169" r="8" fill="#fbf8f1" stroke="#638878" stroke-width="2"/>
    <circle cx="231" cy="169" r="8" fill="#fbf8f1" stroke="#5c738c" stroke-width="2"/>
    <text x="0" y="-212" font-family="Georgia, serif" font-size="24" fill="#5f5b55">H</text>
  </g>
  <g font-family="Georgia, serif" font-size="24" fill="#5f5b55" text-anchor="middle">
    <text x="600" y="1260">λ(Lₐₓz) = λ(z) + 2 log φ</text>
    <text x="600" y="1310">ρ(Lₐₓz) = ρ(z)</text>
  </g>
  <line x1="280" x2="920" y1="1440" y2="1440" stroke="#d9c29b" stroke-width="2"/>
  <g fill="#756f66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">
