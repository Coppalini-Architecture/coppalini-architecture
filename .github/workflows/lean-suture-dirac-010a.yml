name: Lean suture Dirac 010a

on:
  push:
    paths:
      - 'proofs/SutureDirac010a.lean'
      - '.github/workflows/lean-suture-dirac-010a.yml'
  pull_request:
    paths:
      - 'proofs/SutureDirac010a.lean'
      - '.github/workflows/lean-suture-dirac-010a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile 010a with the Lean kernel
        shell: bash
        run: |
          lean --version
          lean --root=. proofs/SutureDirac010a.lean | tee /tmp/010a-axioms.txt
      - name: Reject unproved or strengthened axioms
        shell: bash
        run: |
          ! grep -E 'sorryAx|admit|Lean\.ofReduceBool|axiom ' /tmp/010a-axioms.txt
      - name: Source integrity receipt
        shell: bash
        run: |
          sha256sum proofs/SutureDirac010a.lean
          sha256sum .github/workflows/lean-suture-dirac-010a.yml
          git rev-parse HEAD
