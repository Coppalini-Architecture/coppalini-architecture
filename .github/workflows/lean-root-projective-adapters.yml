name: Lean root projective adapters

on:
  push:
    paths:
      - 'proofs/RootProjectiveAdapters_v2.lean'
      - '.github/workflows/lean-root-projective-adapters.yml'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/RootProjectiveAdapters_v2.lean'
      - '.github/workflows/lean-root-projective-adapters.yml'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECTIVE_RETURN_COMMIT: 43073ed248bad45c94dd12aaa0dbc00a3ec64875
  PROJECTIVE_RETURN_SHA256: c26e6948eb26e0f3081ab37b35732f029c33a37acc4eb02090cfcf6203f320b2

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Read source
        uses: actions/checkout@v4
      - name: Materialize pinned projective-return certificate
        shell: bash
        run: |
          mkdir -p pinned/proofs build/proofs
          git fetch --depth=1 origin "$PROJECTIVE_RETURN_COMMIT"
          git show "$PROJECTIVE_RETURN_COMMIT:proofs/ProjectiveReturn.lean" > pinned/proofs/ProjectiveReturn.lean
          printf '%s  %s\n' "$PROJECTIVE_RETURN_SHA256" pinned/proofs/ProjectiveReturn.lean | sha256sum --check -
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel elaboration of projective return, then root adapters
        shell: bash
        run: |
          lean --version
          mkdir -p build/proofs
          lean --root=pinned -o build/proofs/ProjectiveReturn.olean pinned/proofs/ProjectiveReturn.lean
          LEAN_PATH=build lean --root=. -o build/proofs/RootProjectiveAdapters_v2.olean proofs/RootProjectiveAdapters_v2.lean
      - name: Report axioms used
        shell: bash
        run: |
          printf 'import proofs.RootProjectiveAdapters_v2\n#print axioms RootProjectiveAdapters.real_adapter_conjugacy\n#print axioms RootProjectiveAdapters.complex_adapter_conjugacy\n#print axioms RootProjectiveAdapters.z_real_adapter_intertwiner\n#print axioms RootProjectiveAdapters.projective_return_form_invariant\n' > /tmp/axioms.lean
          LEAN_PATH=build lean /tmp/axioms.lean
      - name: Report provenance and source hashes
        shell: bash
        run: |
          sha256sum pinned/proofs/ProjectiveReturn.lean
          sha256sum proofs/RootProjectiveAdapters_v2.lean
          sha256sum .github/workflows/lean-root-projective-adapters.yml
          git rev-parse HEAD
          git rev-parse "$PROJECTIVE_RETURN_COMMIT"
