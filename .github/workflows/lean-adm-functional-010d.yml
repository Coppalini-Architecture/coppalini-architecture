name: Lean ADM functional 010d

on:
  push:
    paths:
      - 'proofs/ADMFunctional010d.lean'
      - 'proofs/ADMGravity010c.lean'
      - 'proofs/Maxwell010b.lean'
      - 'proofs/SutureDirac010a.lean'
      - '.github/workflows/lean-adm-functional-010d.yml'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/ADMFunctional010d.lean'
      - 'proofs/ADMGravity010c.lean'
      - 'proofs/Maxwell010b.lean'
      - 'proofs/SutureDirac010a.lean'
      - '.github/workflows/lean-adm-functional-010d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile 010a–010d with kernel
        shell: bash
        run: |
          set -o pipefail
          lean --version
          mkdir -p build/proofs
          lean --root=. -o build/proofs/SutureDirac010a.olean proofs/SutureDirac010a.lean | tee /tmp/010a-axioms.txt
          LEAN_PATH=build lean --root=. -o build/proofs/Maxwell010b.olean proofs/Maxwell010b.lean | tee /tmp/010b-axioms.txt
          LEAN_PATH=build lean --root=. -o build/proofs/ADMGravity010c.olean proofs/ADMGravity010c.lean | tee /tmp/010c-axioms.txt
          LEAN_PATH=build lean --root=. proofs/ADMFunctional010d.lean | tee /tmp/010d-axioms.txt
      - name: Enforce axiom boundary
        shell: bash
        run: |
          ! grep -E 'sorryAx|admit|Lean\\.ofReduceBool|axiom ' /tmp/010a-axioms.txt /tmp/010b-axioms.txt /tmp/010c-axioms.txt /tmp/010d-axioms.txt
      - name: Print exact SHA-256 and commit
        shell: bash
        run: |
          sha256sum proofs/SutureDirac010a.lean proofs/Maxwell010b.lean proofs/ADMGravity010c.lean proofs/ADMFunctional010d.lean
          sha256sum .github/workflows/lean-adm-functional-010d.yml
          git rev-parse HEAD
