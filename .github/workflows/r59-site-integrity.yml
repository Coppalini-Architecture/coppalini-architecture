name: R59 proof-led site integrity

on:
  push:
    paths:
      - 'index.html'
      - 'notice/index.html'
      - 'about.html'
      - 'library.html'
      - 'publication-records.html'
      - 'verify.html'
      - 'architecture.html'
      - 'architecture/index.html'
      - 'formalism.html'
      - 'language-mechanics.html'
      - 'site-data.js'
      - 'proofs/minimum-mechanics/index.html'
      - 'papers/symmetric-minimum/index.html'
      - 'research/metric-minimum-root28-v0.1.json'
      - 'research/metric-minimum-root28-v0.1.md'
      - 'research/zenodo-publication-registry-v0.1.json'
      - 'proofs/Root28Reader.lean'
      - 'proofs/ExternalAnchorReceipt.lean'
      - 'verification/root28/**'
      - 'verification/zenodo-publication-registry/**'
      - 'verification/external-anchor-receipt/**'
      - 'research/minimum-mechanics-010u.json'
      - 'research/r59-editorial-manifest.json'
      - 'R59_EDITORIAL_RELEASE.md'
      - 'archive/**'
      - 'assets/proof-led-r59.css'
      - 'assets/notice.css'
      - 'author-page.css'
      - 'language-mechanics.css'
      - 'assets/authors/**'
      - '_redirects'
      - '.gitignore'
      - 'netlify.toml'
      - 'EXTERNAL_ANCHOR_SHA256SUMS'
      - 'EXTERNAL_ANCHOR_COMPILER_RECEIPT.md'
      - 'build/**'
      - 'llms*.txt'
      - 'sitemap.xml'
      - 'tools/verify_r59_publication.py'
      - 'tools/build_public_stage.py'
      - '.github/workflows/r59-site-integrity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'notice/index.html'
      - 'about.html'
      - 'library.html'
      - 'publication-records.html'
      - 'verify.html'
      - 'architecture.html'
      - 'architecture/index.html'
      - 'formalism.html'
      - 'language-mechanics.html'
      - 'site-data.js'
      - 'proofs/minimum-mechanics/index.html'
      - 'papers/symmetric-minimum/index.html'
      - 'research/metric-minimum-root28-v0.1.json'
      - 'research/metric-minimum-root28-v0.1.md'
      - 'research/zenodo-publication-registry-v0.1.json'
      - 'proofs/Root28Reader.lean'
      - 'proofs/ExternalAnchorReceipt.lean'
      - 'verification/root28/**'
      - 'verification/zenodo-publication-registry/**'
      - 'verification/external-anchor-receipt/**'
      - 'research/minimum-mechanics-010u.json'
      - 'research/r59-editorial-manifest.json'
      - 'R59_EDITORIAL_RELEASE.md'
      - 'archive/**'
      - 'assets/proof-led-r59.css'
      - 'assets/notice.css'
      - 'author-page.css'
      - 'language-mechanics.css'
      - 'assets/authors/**'
      - '_redirects'
      - '.gitignore'
      - 'netlify.toml'
      - 'EXTERNAL_ANCHOR_SHA256SUMS'
      - 'EXTERNAL_ANCHOR_COMPILER_RECEIPT.md'
      - 'build/**'
      - 'sitemap.xml'
      - 'llms*.txt'
      - 'tools/verify_r59_publication.py'
      - 'tools/build_public_stage.py'
      - '.github/workflows/r59-site-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the R59 public content, links and provenance
        run: |
          set -euo pipefail
          python3 -I verification/root28/check_root28.py --self-test
          python3 -I verification/zenodo-publication-registry/check_zenodo_publication_registry.py
          python3 tools/verify_r59_publication.py
          python3 -I tools/build_public_stage.py --output public
          test ! -e public/verification/external-anchor-receipt
          test ! -e public/proofs/ExternalAnchorReceipt.lean
      - name: Show source commit
        run: git rev-parse HEAD
