name: Lean Yang–Mills spectral refusal 010r

on:
  push:
    paths:
      - 'proofs/YMGapRefusal010r.lean'
      - 'proofs/YMDiracGapAudit010q.lean'
      - '.github/workflows/lean-ym-gap-refusal-010r.yml'
      - 'scripts/verify_lean_010s.py'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/YMGapRefusal010r.lean'
      - 'proofs/YMDiracGapAudit010q.lean'
      - '.github/workflows/lean-ym-gap-refusal-010r.yml'
      - 'scripts/verify_lean_010s.py'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Pin Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile pinned 010q and exact 010r refusal
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          export LEAN_PATH=proofs
          lean -o proofs/YMDiracGapAudit010q.olean proofs/YMDiracGapAudit010q.lean | tee /tmp/ym-gap-refusal-010q.log
          lean proofs/YMGapRefusal010r.lean | tee /tmp/ym-gap-refusal-010r.log
      - name: Fail-closed source axiom and checksum audit
        shell: bash
        run: |
          set -euo pipefail
          args=()
          args+=(--log /tmp/ym-gap-refusal-010q.log)
          args+=(--log /tmp/ym-gap-refusal-010r.log)
          args+=(--source proofs/YMDiracGapAudit010q.lean)
          args+=(--source proofs/YMGapRefusal010r.lean)
          args+=(--hash-file proofs/YMDiracGapAudit010q.lean)
          args+=(--hash-file proofs/YMGapRefusal010r.lean)
          args+=(--hash-file .github/workflows/lean-ym-gap-refusal-010r.yml)
          python3 scripts/verify_lean_010s.py "${args[@]}"
      - name: Display commit
        shell: bash
        run: git rev-parse HEAD
