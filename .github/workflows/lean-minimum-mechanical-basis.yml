name: Minimum mechanical basis — Lean 4.33.0

on:
  push:
    paths:
      - 'proofs/MinimumMechanicalBasis.lean'
      - 'proofs/MinimumMechanicalSpine.lean'
      - '.github/workflows/lean-minimum-mechanical-basis.yml'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/MinimumMechanicalBasis.lean'
      - 'proofs/MinimumMechanicalSpine.lean'
      - '.github/workflows/lean-minimum-mechanical-basis.yml'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact sources
        uses: actions/checkout@v4
      - name: Verify source hashes
        shell: bash
        run: |
          echo '93f289f0f82f36028551238f19da3b56e985775e62afab23402a50eec0c571a5  proofs/MinimumMechanicalBasis.lean' | sha256sum -c -
          echo '31d8e34ba26abe4ead21bad465088e01b6e46c028fc850f6a0f35f237184106c  proofs/MinimumMechanicalSpine.lean' | sha256sum -c -
      - name: Install Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the proof chain
        shell: bash
        run: |
          lean --version
          mkdir -p build/proofs
          export LEAN_PATH="$PWD/build"
          lean --root=. -o build/proofs/ProjectiveReturn.olean proofs/ProjectiveReturn.lean
          lean --root=. -o build/proofs/RootProjectiveAdapters_v2.olean proofs/RootProjectiveAdapters_v2.lean
          lean --root=. -o build/proofs/RootCarrier.olean proofs/RootCarrier.lean
          lean --root=. -o build/proofs/StabilizerDim.olean proofs/StabilizerDim.lean
          lean --root=. -o build/proofs/MultiplierElimination.olean proofs/MultiplierElimination.lean
          lean --root=. -o build/proofs/MagneticValueAtPi0.olean proofs/MagneticValueAtPi0.lean
          lean --root=. -o build/proofs/MinimumMechanicalBasis.olean proofs/MinimumMechanicalBasis.lean
          lean --root=. proofs/MinimumMechanicalSpine.lean
      - name: Retained receipt
        shell: bash
        run: |
          sha256sum proofs/MinimumMechanicalBasis.lean proofs/MinimumMechanicalSpine.lean
          git rev-parse HEAD
