name: Lean root carrier and CHSH

on:
  push:
    paths:
      - 'proofs/RootCarrier.lean'
      - 'proofs/CHSH.lean'
      - '.github/workflows/lean-root-carrier-chsh.yml'
  pull_request:
    paths:
      - 'proofs/RootCarrier.lean'
      - 'proofs/CHSH.lean'
      - '.github/workflows/lean-root-carrier-chsh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Read source
        uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel elaboration of root carrier
        shell: bash
        run: |
          lean --version
          lean proofs/RootCarrier.lean
      - name: Kernel elaboration of CHSH carrier
        shell: bash
        run: lean proofs/CHSH.lean
      - name: Report provenance and source hashes
        shell: bash
        run: |
          sha256sum proofs/RootCarrier.lean proofs/CHSH.lean .github/workflows/lean-root-carrier-chsh.yml
          git rev-parse HEAD
