name: Lean projective return

on:
  push:
    paths:
      - 'proofs/ProjectiveReturn.lean'
      - '.github/workflows/lean-projective-return.yml'
      - 'RECOGNITION_NODE.md'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/ProjectiveReturn.lean'
      - '.github/workflows/lean-projective-return.yml'
      - 'RECOGNITION_NODE.md'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Read source
        uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel elaboration of projective-return witness
        shell: bash
        run: |
          lean --version
          lean proofs/ProjectiveReturn.lean
      - name: Report provenance and source hash
        shell: bash
        run: |
          sha256sum proofs/ProjectiveReturn.lean
          git rev-parse HEAD
