name: Lean Palatini and Flat EH 010h

on:
  push:
    paths:
      - 'proofs/ConnectionPalatini010h.lean'
      - 'proofs/FlatEH010h.lean'
      - 'proofs/FlatEHFunctional010h.lean'
      - '.github/workflows/lean-palatini-010h.yml'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/ConnectionPalatini010h.lean'
      - 'proofs/FlatEH010h.lean'
      - '.github/workflows/lean-palatini-010h.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile 010a–010h dependency chain
        shell: bash
        run: |
          set -o pipefail
          lean --version
          mkdir -p build/proofs
          lean --root=. -o build/proofs/SutureDirac010a.olean proofs/SutureDirac010a.lean | tee /tmp/010a.log
          LEAN_PATH=build lean --root=. -o build/proofs/Maxwell010b.olean proofs/Maxwell010b.lean | tee /tmp/010b.log
          LEAN_PATH=build lean --root=. -o build/proofs/ADMGravity010c.olean proofs/ADMGravity010c.lean | tee /tmp/010c.log
          LEAN_PATH=build lean --root=. -o build/proofs/ADMFunctional010d.olean proofs/ADMFunctional010d.lean | tee /tmp/010d.log
          LEAN_PATH=build lean --root=. -o build/proofs/JetStokes010e.olean proofs/JetStokes010e.lean | tee /tmp/010e-jet.log
          LEAN_PATH=build lean --root=. -o build/proofs/FourierTorus010e.olean proofs/FourierTorus010e.lean | tee /tmp/010e-fourier.log
          LEAN_PATH=build lean --root=. -o build/proofs/CanonicalPoisson010f.olean proofs/CanonicalPoisson010f.lean | tee /tmp/010f-canonical.log
          LEAN_PATH=build lean --root=. -o build/proofs/LinearTransport010f.olean proofs/LinearTransport010f.lean | tee /tmp/010f-transport.log
          LEAN_PATH=build lean --root=. -o build/proofs/LaurentPoisson010g.olean proofs/LaurentPoisson010g.lean | tee /tmp/010g-laurent.log
          LEAN_PATH=build lean --root=. -o build/proofs/FourierPairing010g.olean proofs/FourierPairing010g.lean | tee /tmp/010g-pairing.log
          LEAN_PATH=build lean --root=. -o build/proofs/ConnectionPalatini010h.olean proofs/ConnectionPalatini010h.lean | tee /tmp/010h-palatini.log
          LEAN_PATH=build lean --root=. -o build/proofs/FlatEH010h.olean proofs/FlatEH010h.lean | tee /tmp/010h-flat.log
          LEAN_PATH=build lean --root=. proofs/FlatEHFunctional010h.lean | tee /tmp/010h-functional.log
      - name: Axiom audit
        shell: bash
        run: |
          ! grep -E 'sorryAx|admit|Lean\\.ofReduceBool|axiom ' /tmp/010{a,b,c,d}.log /tmp/010e-jet.log /tmp/010e-fourier.log /tmp/010f-canonical.log /tmp/010f-transport.log /tmp/010g-laurent.log /tmp/010g-pairing.log /tmp/010h-palatini.log /tmp/010h-flat.log /tmp/010h-functional.log
      - name: SHA-256 and commit
        shell: bash
        run: |
          sha256sum proofs/SutureDirac010a.lean proofs/Maxwell010b.lean proofs/ADMGravity010c.lean proofs/ADMFunctional010d.lean proofs/JetStokes010e.lean proofs/FourierTorus010e.lean proofs/CanonicalPoisson010f.lean proofs/LinearTransport010f.lean proofs/LaurentPoisson010g.lean proofs/FourierPairing010g.lean proofs/ConnectionPalatini010h.lean proofs/FlatEH010h.lean proofs/FlatEHFunctional010h.lean
          sha256sum .github/workflows/lean-palatini-010h.yml
          git rev-parse HEAD
