name: Lean Yang–Mills Dirac spectral audit 010q

on:
  push:
    paths:
      - 'proofs/YMDiracGapAudit010q.lean'
      - '.github/workflows/lean-ym-dirac-gap-010q.yml'
      - 'scripts/verify_lean_010s.py'
      - 'SHA256SUMS'
  pull_request:
    paths:
      - 'proofs/YMDiracGapAudit010q.lean'
      - '.github/workflows/lean-ym-dirac-gap-010q.yml'
      - 'scripts/verify_lean_010s.py'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Pin Lean 4.33.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile gauge algebra and spectral-boundary theorem
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lean --root=. proofs/YMDiracGapAudit010q.lean | tee /tmp/ym-gap-010q.log
      - name: Fail-closed source axiom and checksum audit
        shell: bash
        run: |
          set -euo pipefail
          args=()
          args+=(--log /tmp/ym-gap-010q.log)
          args+=(--source proofs/YMDiracGapAudit010q.lean)
          args+=(--hash-file proofs/YMDiracGapAudit010q.lean)
          args+=(--hash-file .github/workflows/lean-ym-dirac-gap-010q.yml)
          python3 scripts/verify_lean_010s.py "${args[@]}"
      - name: Display commit
        shell: bash
        run: git rev-parse HEAD
